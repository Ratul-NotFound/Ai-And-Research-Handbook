<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark Minimal Squircle Background -->
  <rect width="512" height="512" rx="105" fill="#12151c" />
  <rect x="12" y="12" width="488" height="488" rx="93" fill="#181c26" stroke="#252b3b" stroke-width="4" />
  
  <!-- Outer Cyan Book Outline Box -->
  <rect x="130" y="130" width="252" height="252" rx="28" fill="none" stroke="#00c8f8" stroke-width="22" stroke-linejoin="round" />
  
  <!-- Center Purple Spine Line -->
  <line x1="256" y1="130" x2="256" y2="382" stroke="#a855f7" stroke-width="18" stroke-linecap="round" />
  
  <!-- Left Page Code/Text Bars (White) -->
  <line x1="180" y1="205" x2="230" y2="205" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round" />
  <line x1="180" y1="256" x2="222" y2="256" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round" />
  <line x1="180" y1="307" x2="230" y2="307" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round" />
  
  <!-- Right Page Code/Text Bars (White) -->
  <line x1="282" y1="205" x2="332" y2="205" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round" />
  <line x1="290" y1="256" x2="332" y2="256" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round" />
  <line x1="282" y1="307" x2="332" y2="307" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round" />
  
  <!-- Center Cyan Synaptic Core Node -->
  <circle cx="256" cy="256" r="34" fill="#00c8f8" />
</svg>
